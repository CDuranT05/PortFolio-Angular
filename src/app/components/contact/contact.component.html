<section class="contact-area" id="contacto">
  <div class="container-fluid contact-container">
    <div class="row g-5">

      <!-- CTA izquierda -->
      <div class="col-lg-4 col-md-12">
        <div class="contact-cta">
          <span class="section-label">
            <i class="ri-mail-send-line"></i> Contacto
          </span>
          <h2>¿Hablemos?</h2>
          <p>Estoy abierta a nuevas oportunidades y proyectos desafiantes.
            ¡Hablemos de cómo puedo aportar valor a tu equipo!</p>
          <button
            (click)="sendEmail()"
            class="default-btn default-btn-primary">
            <i class="ri-mail-send-line"></i> Envíame un mensaje
          </button>
        </div>
      </div>

      <!-- Info centro -->
      <div class="col-lg-4 col-md-12">
        <div class="contact-info-box">
          <h3>Información de contacto</h3>
          <ul class="contact-info-list">
            <li>
              <span class="contact-icon"><i class="ri-mail-line"></i></span>
              <span>ClaudiaduranTupano&#64;gmail.com</span>
            </li>
            <li>
              <span class="contact-icon"><i class="ri-map-pin-line"></i></span>
              <span>Venezuela</span>
            </li>
          </ul>
        </div>
      </div>

      <!-- Redes derecha -->
      <div class="col-lg-4 col-md-12">
        <div class="contact-info-box">
          <h3>Conectemos</h3>
          <p class="connect-desc">
            Sígueme en mis redes para ver más sobre mi trabajo y proyectos personales.
          </p>
          <div class="contact-social">
            <a href="https://www.linkedin.com/in/claudia-duran-tupano/"
              target="_blank" class="social-btn" title="LinkedIn">
              <i class="ri-linkedin-fill"></i>
            </a>
            <a href="https://github.com/CDu"
              target="_blank" class="social-btn" title="GitHub">
              <i class="ri-github-fill"></i>
            </a>
            <a href="mailto:ClaudiaduranTupano@gmail.com"
              class="social-btn" title="Email">
              <i class="ri-mail-line"></i>
            </a>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
