<section class="projects-area" id="proyectos">
  <div class="container-fluid projects-container">

    <div class="section-header">
      <span class="section-label">
        <i class="ri-briefcase-4-line"></i> Proyectos destacados
      </span>
    </div>

    <div class="areas-grid">

      <div class="area-column" *ngFor="let area of areas; let i = index" [class.area-open]="openAreas[i]">
        <button type="button" class="area-header" (click)="toggleArea(i)">
          <div class="area-header-text">
            <h3><i [class]="area.icon"></i> {{ area.title }}</h3>
            <p>{{ area.subtitle }}</p>
          </div>
          <span class="area-meta">
            <span class="area-count">{{ area.projects.length }}</span>
            <i class="ri-arrow-down-s-line area-chevron"></i>
          </span>
        </button>

        <div class="area-projects" *ngIf="openAreas[i]">
          <button type="button" class="project-row" *ngFor="let project of area.projects" (click)="openModal(project)">
            <span class="project-row-name">{{ project.title }}</span>
            <span class="project-row-tags">
              <span class="project-row-tag" *ngFor="let tag of project.tags">
                <i [class]="tag.icon"></i> {{ tag.name }}
              </span>
            </span>
            <i class="ri-arrow-right-s-line project-row-arrow"></i>
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Modal de detalle de proyecto -->
  <div class="project-modal-backdrop" *ngIf="selectedProject" (click)="closeModal()">
    <div class="project-modal" (click)="$event.stopPropagation()">
      <button type="button" class="modal-close" (click)="closeModal()" aria-label="Cerrar">
        <i class="ri-close-line"></i>
      </button>

      <div class="modal-img" [ngClass]="selectedProject.imgClass">
        <img [src]="selectedProject.image" [alt]="selectedProject.title" />
        <span class="project-badge" [ngClass]="selectedProject.badgeClass">{{ selectedProject.category }}</span>
      </div>

      <div class="modal-body">
        <h3>{{ selectedProject.title }}</h3>
        <p class="modal-description">{{ selectedProject.fullDescription }}</p>

        <div class="modal-section">
          <h4><i class="ri-user-star-line"></i> Mi rol</h4>
          <p>{{ selectedProject.role }}</p>
        </div>

        <div class="modal-section" *ngIf="selectedProject.features.length">
          <h4><i class="ri-checkbox-circle-line"></i> Funcionalidades destacadas</h4>
          <ul>
            <li *ngFor="let feature of selectedProject.features">{{ feature }}</li>
          </ul>
        </div>

        <div class="modal-section">
          <h4><i class="ri-code-s-slash-line"></i> Tecnologías</h4>
          <div class="project-tags">
            <span *ngFor="let tag of selectedProject.tags">
              <i [class]="tag.icon"></i> {{ tag.name }}
            </span>
          </div>
        </div>

        <div class="modal-actions" *ngIf="selectedProject.demoLink || selectedProject.repoLink">
          <a *ngIf="selectedProject.demoLink" [href]="selectedProject.demoLink" target="_blank" rel="noopener" class="default-btn default-btn-primary">
            <i class="ri-external-link-line"></i> Ver proyecto
          </a>
          <a *ngIf="selectedProject.repoLink" [href]="selectedProject.repoLink" target="_blank" rel="noopener" class="default-btn default-btn-outline">
            <i class="ri-github-fill"></i> Código
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
